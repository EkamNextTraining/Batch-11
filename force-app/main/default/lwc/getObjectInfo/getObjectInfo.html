<template>
    <lightning-card title="Get Object Info">
        <template if:true={options.length}>
        <lightning-combobox
            name="industry"
            label="Industry"
            value={value}
            placeholder="Select Industry"
            options={options}
            onchange={handleChange} ></lightning-combobox>

    <p>Selected value is: {value}</p>
        </template>
    </lightning-card>
</template>
