<template>
    <lightning-card title="PubSub Publisher Component">
        <div class="slds-p-around_medium">
            <lightning-input label="Enter Account Name"  value={accountName} onchange={handleChange}>
            </lightning-input>
            <lightning-input label="Enter Phone"  value={accountPhone} onchange={handlePhoneChange}>
            </lightning-input>
            <lightning-button label="Publish" onclick={handlePublish}>
            </lightning-button>
        </div>
    </lightning-card>
</template>
